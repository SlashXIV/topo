<?xml version="1.0" encoding="UTF-8"?>
<!--
    Topo — icone d'application, source de reference.

    Meme grammaire que les autres applications de l'auteur (Kalos, Dromos, Popote,
    Brut) : une lettre tracee a la main, un trait d'accent fin dessous, les couleurs
    de la DA, et un detail qui raconte l'application.

    Dessinee dans le systeme de coordonnees des icones adaptatives Android :
    canevas 108x108, dont seuls les 72x72 centraux sont garantis visibles, et seul
    un cercle de 66 de diametre survit au masque le plus agressif. La lettre et le
    trait tiennent dans ce cercle ; le decor deborde volontairement.

    Ce fichier est la SOURCE. Les VectorDrawable de `app/src/main/res/drawable/`
    en derivent : `ic_launcher_background` (papier, rochers, depart),
    `ic_launcher_foreground` et `splash_icon` (lettre et trait),
    `ic_launcher_monochrome` (lettre et trait, pour les icones a theme).
    Toute modification se fait ici d'abord, puis se reporte dans les XML.

    DA « le topo papier » (refonte de novembre 2026) : l'icone est une page de topo.
    C'est la seule icone claire de la famille, ce qui la rend distincte a cote des
    quatre autres, toutes sur fond sombre.
      - deux ROCHERS hachures, comme les croquis d'un guide de bloc. Les
        VectorDrawable n'ont pas de motif : dans les XML, les hachures sont des
        traits a 45 degres decoupes par le contour du rocher ;
      - un DEPART POINTILLE qui monte vers le point d'arrivee orange : le trace
        numerote que l'application dessine sur les photos.

    ZONE D'EXCLUSION : x 36.5..71.5 y 33..74, l'englobant de la lettre ET du trait,
    marge comprise. Aucun rocher n'y entre. Positions mesurees, pas estimees
    (contour rasterise, intersecte avec les masques) : rocher bas-gauche 81 % visible
    dans un cercle de rayon 36, rocher haut-droit 98 % ; les points du depart a moins
    de 34 du centre.

    Palette :
      papier          #EEEAE0   (TopoPalettes.Paper.paper)
      encre           #1B1A17   lettre, contours et hachures (a 55 %)
      orange          #C46A1C   trait et depart. Plus sombre que l'orange
                                « main droite » #F2A65A, qui se perdait sur le
                                papier a la taille d'une icone.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">

  <defs>
    <!-- Squircle : approximation du masque des lanceurs, pour la previsualisation.
         Le systeme applique son propre masque, ce clip ne part pas dans l'APK. -->
    <clipPath id="squircle">
      <path d="M54,0
               C86,0 108,22 108,54
               C108,86 86,108 54,108
               C22,108 0,86 0,54
               C0,22 22,0 54,0 Z"/>
    </clipPath>
    <pattern id="hatch" width="3.2" height="3.2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="0.9" height="3.2" fill="#1B1A17" fill-opacity="0.55"/>
    </pattern>
  </defs>

  <g clip-path="url(#squircle)">

    <rect width="108" height="108" fill="#EEEAE0"/>

    <!-- Rochers : hachures puis contour a l'encre. -->
    <g stroke="#1B1A17" stroke-width="1.4" stroke-linejoin="round" fill="url(#hatch)">
      <path d="M22,78L25,63L30,66L34,57L35.5,59L35.5,77L44,79L48,87L28,86Z"/>
      <path d="M56,31L60,24L66,27L72,21L81,30L84,41L80,50L73.5,48L73,33Z"/>
    </g>

    <!-- Depart pointille, puis le point d'arrivee. -->
    <g fill="#C46A1C">
      <circle cx="57.5" cy="87.5" r="1.05"/>
      <circle cx="62.5" cy="85.5" r="1.05"/>
      <circle cx="67.5" cy="83" r="1.05"/>
      <circle cx="72" cy="79.5" r="1.05"/>
      <circle cx="76" cy="75.5" r="1.05"/>
      <circle cx="79.5" cy="71.5" r="2.6"/>
    </g>

    <!-- Lettre T : hauteur 29, la reference des quatre autres icones de la famille.
         Tracee a la main plutot que convertie depuis une police. -->
    <path d="M40,35 L68,35 L68,44 L58.5,44 L58.5,64 L49.5,64 L49.5,44 L40,44 Z"
          fill="#1B1A17"/>

    <!-- Trait d'accent : un TRAIT, pas un bandeau, 31x2 comme dans toute la famille. -->
    <rect x="38.5" y="70" width="31" height="2" rx="1" fill="#C46A1C"/>

  </g>
</svg>
