# --- JVM du demon Gradle ---
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# --- Performance de build ---
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=false

# --- Android ---
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9.0 compile le Kotlin lui-meme (android.builtInKotlin=true par defaut) et
# REFUSE le plugin autonome org.jetbrains.kotlin.android : celui-ci est
# incompatible avec le nouveau DSL d'AGP 9 (android.newDsl=true).
# On reste donc sur le comportement par defaut. Consequence pratique : les
# modules Android n'appliquent plus aucun plugin Kotlin, et jvmTarget suit
# automatiquement android.compileOptions.targetCompatibility.
# Seul :core:domain, module JVM pur, applique org.jetbrains.kotlin.jvm.

# --- Kotlin ---
kotlin.code.style=official

# --- Note environnement ---
# AGP 9.1 exige un JDK 17+. Le JDK du PATH de la machine de dev est un JDK 8 :
# lancer gradlew depuis un terminal necessite donc soit un JAVA_HOME correct, soit
# le JDK embarque d'Android Studio :
#   export JAVA_HOME="/c/Program Files/Android/Android Studio/jbr"
# Volontairement pas de org.gradle.java.home ici : ce fichier est versionne et ne
# doit pas contenir de chemin specifique a une machine.
